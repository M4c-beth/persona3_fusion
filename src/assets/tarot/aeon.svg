<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 517" role="img" aria-label="Aeon tarot card">
  <!-- Original card for Aeon (not part of the 1909 deck), drawn to sit beside the Rider–Waite–Smith scans. -->
  <rect width="300" height="517" fill="#f1e6c8"/>
  <rect x="9" y="9" width="282" height="499" fill="none" stroke="#1d1a17" stroke-width="5"/>
  <rect x="20" y="20" width="260" height="430" fill="#e9c97a" stroke="#1d1a17" stroke-width="3"/>
  <!-- night sky -->
  <rect x="20" y="20" width="260" height="250" fill="#5f86b8"/>
  <g fill="#fdf6dc" stroke="#1d1a17" stroke-width="1.5">
    <path d="M60 60l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z"/>
    <path d="M232 52l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/>
    <path d="M248 128l3 6 6 1-4 4 1 6-6-3-5 3 1-6-4-4 6-1z"/>
    <path d="M46 150l3 6 6 1-4 4 1 6-6-3-5 3 1-6-4-4 6-1z"/>
  </g>
  <!-- sun rays behind the eclipse -->
  <g stroke="#1d1a17" stroke-width="2.5" fill="#f6c94a">
    <path d="M150 70l10 48h-20z"/><path d="M150 330l-10-48h20z"/>
    <path d="M30 200l48-10v20z"/><path d="M270 200l-48 10v-20z"/>
    <path d="M65 115l42 26-14 14z"/><path d="M235 285l-42-26 14-14z"/>
    <path d="M235 115l-26 42-14-14z"/><path d="M65 285l26-42 14 14z"/>
  </g>
  <!-- sun and moon meeting -->
  <circle cx="150" cy="200" r="72" fill="#f6c94a" stroke="#1d1a17" stroke-width="3"/>
  <path d="M150 128a72 72 0 0 1 0 144a52 72 0 0 0 0-144z" fill="#2b3f66" stroke="#1d1a17" stroke-width="3"/>
  <circle cx="122" cy="186" r="5" fill="#1d1a17"/>
  <path d="M110 222q14 12 28 0" fill="none" stroke="#1d1a17" stroke-width="3" stroke-linecap="round"/>
  <!-- ground and figures' path -->
  <path d="M20 330q130-40 260 0v120H20z" fill="#8bab5e" stroke="#1d1a17" stroke-width="3"/>
  <path d="M150 450q-8-60 0-118q8 58 0 118z" fill="#f1e6c8" stroke="#1d1a17" stroke-width="2.5"/>
  <path d="M60 450l20-70 10 70z" fill="#4f6d3a" stroke="#1d1a17" stroke-width="2"/>
  <path d="M240 450l-20-70-10 70z" fill="#4f6d3a" stroke="#1d1a17" stroke-width="2"/>
  <!-- title -->
  <rect x="20" y="450" width="260" height="46" fill="#f1e6c8" stroke="#1d1a17" stroke-width="3"/>
  <text x="150" y="483" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#1d1a17">AEON</text>
</svg>
